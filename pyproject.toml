[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "witness"
version = "0.1.0"
description = "Witness: data-flow review for code changes."
requires-python = ">=3.12"
dependencies = [
  "msgspec",
  "rustworkx",
  "rich",
  "mcp",
  "intervaltree",
  "pyyaml",
]

[project.scripts]
witness = "witness.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic"]

[dependency-groups]
dev = ["pytest", "hypothesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "joern: needs a real Joern install",
]

[tool.uv]
# cryptography 49+ has no wheel for this toolchain; the local cargo is too old to build it from source.
constraint-dependencies = ["cryptography<49"]
