<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="witness: two deep-set eyes under a heavy brow, each iris a small data-flow graph">
  <title>witness</title>
  <defs>
    <linearGradient id="brow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="socket" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#0b1020" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.6" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="eyeL"><path d="M42 150 Q76 124 110 150 Q76 172 42 150 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M146 150 Q180 124 214 150 Q180 172 146 150 Z"/></clipPath>
  </defs>

  <g transform="translate(0 -4)">

  <!-- sockets: the hollows the eyes sit back in -->
  <ellipse cx="76" cy="146" rx="50" ry="36" fill="url(#socket)"/>
  <ellipse cx="180" cy="146" rx="50" ry="36" fill="url(#socket)"/>

  <!-- left eye -->
  <g clip-path="url(#eyeL)">
    <rect x="40" y="120" width="72" height="56" fill="url(#sclera)"/>
    <circle cx="76" cy="152" r="14" fill="url(#iris)"/>
    <path d="M69 147 L76 152 L83 147 M76 152 L76 160" stroke="#ecfeff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="76" cy="152" r="4.6" fill="#0b1020"/>
    <g fill="#ecfeff"><circle cx="69" cy="147" r="1.6"/><circle cx="83" cy="147" r="1.6"/><circle cx="76" cy="160" r="1.6"/></g>
    <rect x="40" y="120" width="72" height="26" fill="url(#lid)"/>
  </g>

  <!-- right eye -->
  <g clip-path="url(#eyeR)">
    <rect x="144" y="120" width="72" height="56" fill="url(#sclera)"/>
    <circle cx="180" cy="152" r="14" fill="url(#iris)"/>
    <path d="M173 147 L180 152 L187 147 M180 152 L180 160" stroke="#ecfeff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="180" cy="152" r="4.6" fill="#0b1020"/>
    <g fill="#ecfeff"><circle cx="173" cy="147" r="1.6"/><circle cx="187" cy="147" r="1.6"/><circle cx="180" cy="160" r="1.6"/></g>
    <rect x="144" y="120" width="72" height="26" fill="url(#lid)"/>
  </g>

  <!-- glints sit low: light only reaches under the brow -->
  <circle cx="81" cy="156" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="185" cy="156" r="1.8" fill="#ffffff" opacity="0.9"/>

  <!-- heavy brow ridge overhanging the sockets -->
  <path d="M20 118 Q66 70 120 104 Q128 109 136 104 Q190 70 236 118 Q241 123 236 128 Q190 92 136 120 Q128 125 120 120 Q66 92 20 128 Q15 123 20 118 Z"
        fill="url(#brow)" filter="url(#glow)"/>

  <!-- shadow the brow casts down into the sockets -->
  <path d="M30 126 Q68 96 118 122 L118 130 Q68 108 30 136 Z" fill="#0b1020" opacity="0.5" filter="url(#soft)"/>
  <path d="M226 126 Q188 96 138 122 L138 130 Q188 108 226 136 Z" fill="#0b1020" opacity="0.5" filter="url(#soft)"/>
  </g>
</svg>
