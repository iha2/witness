guard:
  - "validate*"
  - "sanitize*"
  - "check_*"
  - "assert_*"
  - "authorize*"
  - "require_*"
source:
  - "input"
  - "os.getenv"
  - "os.environ.get"
  - "sys.stdin.*"
  - "*.getParameter"
sink:
  - "exec"
  - "eval"
  - "system"
  - "*.execute"
  - "*.executemany"
  - "db.*.insert"
  - "db.*.update"
  - "db.*.delete"
  - "*.log"
  - "*.send"
